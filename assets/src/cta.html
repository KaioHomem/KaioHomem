<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;700&display=block">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 580px; height: 76px; overflow: hidden; background: transparent; }
  a { position: absolute; inset: 0; display: flex; align-items: stretch; text-decoration: none;
    border-radius: 6px; overflow: hidden; background: #8b5cf6; color: #070708; -webkit-font-smoothing: antialiased; }
  .play { width: 76px; display: grid; place-items: center; background: #070708; border: 2px solid #8b5cf6; border-right: 0; border-radius: 6px 0 0 6px; }
  .play i { width: 0; height: 0; border-left: 18px solid #8b5cf6; border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 5px; }
  .txt { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 22px; gap: 5px; }
  .big { font-family: "Archivo", sans-serif; font-weight: 800; font-variation-settings: "wdth" 125; font-size: 23px; letter-spacing: -0.02em; white-space: nowrap; text-transform: uppercase; line-height: 1; }
  .url { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 500; letter-spacing: .04em; opacity: .78; }
  .arrow { width: 64px; display: grid; place-items: center; font-family: "Archivo", sans-serif; font-weight: 700; font-size: 30px; border-left: 1px solid rgb(7 7 8 / .25); }
</style>
</head>
<body>
  <a><span class="play"><i></i></span>
    <span class="txt"><span class="big">Press play on my portfolio</span><span class="url">kaiohomem.github.io</span></span>
    <span class="arrow">↗</span></a>
<script>window.ready = document.fonts.ready;</script>
</body>
</html>
