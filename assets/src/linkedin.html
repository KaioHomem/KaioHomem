<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;700&display=block">
<style>
  :root { --ink-950: #070708; --ink-900: #0a0a0b; --ink-800: #121214; --paper: #eceef0; --paper-dim: #b9bcc2; --muted: #8d9097; --muted-2: #5f6269;
    --signal: #ff5a1f; --line: rgb(236 238 240 / 0.1); --line-strong: rgb(236 238 240 / 0.22); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1584px; height: 396px; overflow: hidden; background: var(--ink-900); }
  body { font-family: "Archivo", sans-serif; color: var(--paper); -webkit-font-smoothing: antialiased; position: relative; }
  .mono { font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .grid { position: absolute; inset: 0; opacity: .35; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 66px 66px; background-position: -1px 41px; }
  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 30% 75% at 84% 48%, rgb(255 90 31 / .09), transparent 70%), radial-gradient(ellipse at 60% 50%, transparent 55%, rgb(0 0 0 / .5)); }
  .top { position: absolute; left: 0; right: 0; top: 0; height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px;
    border-bottom: 1px solid var(--line); background: rgb(7 7 8 / .7); color: var(--muted); }
  .top .l { display: flex; gap: 10px; align-items: center; color: var(--paper-dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 10px var(--signal); display: inline-block; }
  .avail { display: flex; gap: 10px; align-items: center; color: var(--paper-dim); }
  .tc { color: var(--signal); font-weight: 700; }
  .url { position: absolute; left: 32px; top: 74px; display: flex; flex-direction: column; gap: 10px; }
  .url .k { color: var(--muted-2); }
  .url .v { color: var(--signal); font-size: 15px; font-weight: 500; display: flex; gap: 10px; align-items: center; }
  .url .v i { width: 0; height: 0; border-left: 9px solid var(--signal); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .copy { position: absolute; left: 470px; top: 66px; }
  .label { color: var(--muted); display: flex; gap: 10px; }
  .label b { color: var(--signal); font-weight: 500; }
  h1 { margin-top: 14px; font-weight: 800; font-variation-settings: "wdth" 125; font-size: 66px; line-height: .9; letter-spacing: -0.035em; text-transform: uppercase; }
  h1 span { color: var(--signal); }
  .lead { margin-top: 14px; font-size: 24px; font-weight: 400; font-variation-settings: "wdth" 110; color: var(--paper-dim); }
  .what { margin-top: 12px; color: var(--paper-dim); display: flex; gap: 10px; align-items: center; }
  .what i { width: 6px; height: 6px; background: var(--signal); transform: rotate(45deg); display: inline-block; }
  #mono { position: absolute; width: 400px; height: 400px; right: 40px; top: -6px; }
  .tl { position: absolute; left: 440px; right: 0; bottom: 0; height: 50px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--ink-950); }
  .ruler { position: absolute; left: 30px; right: 28px; top: 0; height: 20px; border-bottom: 1px solid var(--line); }
  .tick { position: absolute; bottom: 0; width: 1px; background: var(--line-strong); }
  .lane { position: absolute; left: 30px; right: 28px; top: 26px; height: 18px; }
  .bar { position: absolute; top: 4px; height: 10px; border-radius: 3px; background: rgb(255 90 31 / .16); }
  .kf { position: absolute; top: 3px; width: 11px; height: 11px; margin-left: -5.5px; transform: rotate(45deg); border: 1.5px solid var(--paper-dim); background: var(--ink-950); }
  .kf.on { background: var(--signal); border-color: var(--signal); box-shadow: 0 0 10px rgb(255 90 31 / .7); }
  .ph { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--signal); }
  .ph::before { content: ""; position: absolute; top: 0; left: -6px; width: 13px; height: 12px; background: var(--signal); clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%); }
</style>
</head>
<body>
<div class="grid"></div><div class="glow"></div>
<div class="top mono">
  <div class="l"><span class="dot"></span>KAIO_FELIPE.comp</div>
  <div class="avail"><span class="dot"></span>Disponível para estágio &amp; primeiro emprego</div>
  <div class="tc">00:00:02:10</div>
</div>
<div class="url mono"><span class="k">Portfólio</span><span class="v"><i></i>kaiohomem.github.io</span><span class="k" style="margin-top:6px">GitHub</span><span class="v" style="color:var(--paper-dim)">@KaioHomem</span></div>
<div class="copy">
  <div class="label mono"><b>COMP 01</b><span>Ciência da Computação · IFSC</span><span>·</span><span>Brasil</span></div>
  <h1>Dev, motion<br>e CGI<span>.</span></h1>
  <p class="lead">Código de dia, Blender de noite.</p>
  <div class="what mono">Sites<i></i>Apps web &amp; mobile<i></i>Ferramentas<i></i>Produtos digitais<i></i>Vídeo 3D</div>
</div>
<img id="mono" src="cgi/kf_040.webp">
<div class="tl"><div class="ruler" id="ruler"></div><div class="lane" id="lane"></div><div class="ph" id="ph"></div></div>
<script>
  const W = 1584 - 440 - 30 - 28, x = (t) => (t / 6.5) * W;
  for (let s = 0; s <= 6.5; s += 0.25) { const d = document.createElement("div"); d.className = "tick"; const m = Math.abs(s - Math.round(s)) < 1e-6;
    d.style.left = x(s) + "px"; d.style.height = m ? "10px" : "4px"; ruler.appendChild(d); }
  const b = document.createElement("div"); b.className = "bar"; b.style.left = "0px"; b.style.width = x(6.2) + "px"; lane.appendChild(b);
  [[0, 0], [1.6, 1], [5.4, 0], [6.2, 0]].forEach(([t, on]) => { const d = document.createElement("div"); d.className = "kf" + (on ? " on" : ""); d.style.left = x(t) + "px"; lane.appendChild(d); });
  ph.style.left = 30 + x(1.6) + "px";
  window.ready = Promise.all([document.fonts.ready, new Promise((r) => { const im = document.getElementById("mono"); im.complete ? r() : (im.onload = im.onerror = r); })]);
</script>
</body>
</html>
